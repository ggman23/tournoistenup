            const tr = document.createElement('tr');
            if(c.rank <= 3) tr.className = 'top-tier';
            
            let htmlStr = `<td class="pos-col">${c.displayRank}</td><td><strong>${c.club}</strong></td>`;
            divisions.forEach(d => htmlStr += `<td class="div-col">${c[d] === 0 ? '' : c[d]}</td>`); 
            htmlStr += `<td class="tot-col">${c.total}</td><td class="pts-col"><strong>${c.score}</strong></td>`;
            
            tr.innerHTML = htmlStr;
            tbody.appendChild(tr);
        });
    }
    
    updateDashboard();
</script>
</body>
</html>
