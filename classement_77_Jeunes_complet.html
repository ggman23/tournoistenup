        label.className = 'filter-item';
        label.innerHTML = `<input type="checkbox" value="${cat}" checked onchange="updateDashboard()"> ${cat}`;
        filtersDiv.appendChild(label);
    });

    function updateDashboard() {
        const checkedBoxes = Array.from(document.querySelectorAll('#categoryFilters input:checked')).map(cb => cb.value);
        
        const wD1 = parseInt(document.getElementById('wD1').value);
        const wD2 = parseInt(document.getElementById('wD2').value);
        const wD3 = parseInt(document.getElementById('wD3').value);
        const wD4 = parseInt(document.getElementById('wD4').value);
        
        document.getElementById('valD1').innerText = wD1; document.getElementById('valD2').innerText = wD2;
        document.getElementById('valD3').innerText = wD3; document.getElementById('valD4').innerText = wD4;

        const clubMap = new Map();
        
        rawData.forEach(row => {
            if (checkedBoxes.includes(row.category)) {
                if (!clubMap.has(row.club)) {
                    clubMap.set(row.club, { club: row.club, D1: 0, D2: 0, D3: 0, D4: 0 });
                }
                const clubData = clubMap.get(row.club);
                clubData.D1 += row.D1;
                clubData.D2 += row.D2;
                clubData.D3 += row.D3;
                clubData.D4 += row.D4;
            }
        });

        const processed = Array.from(clubMap.values()).map(c => ({ 
            ...c, 
            score: (c.D1*wD1) + (c.D2*wD2) + (c.D3*wD3) + (c.D4*wD4), 
            total: c.D1 + c.D2 + c.D3 + c.D4 
        }));
        
        processed.sort((a, b) => b.score !== a.score ? b.score - a.score : (b.D1 !== a.D1 ? b.D1 - a.D1 : b.total - a.total));

        // NOUVEAU : Logique de classement avec gestion des ex aequo
        let currentRank = 1;
        processed.forEach((c, i) => {
            if (i > 0) {
                const prev = processed[i - 1];
                // Vérification de l'égalité stricte sur les 3 critères de tri
                const isTied = (c.score === prev.score) && (c.D1 === prev.D1) && (c.total === prev.total);
                if (!isTied) {
                    currentRank = i + 1;
                }
            }
            c.rank = currentRank;

        });

            tbody.innerHTML = '<tr><td colspan="8">Aucune donnée pour les catégories sélectionnées.</td></tr>';

        });
