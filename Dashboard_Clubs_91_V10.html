    const categories = [...new Set(rawData.map(item => item.category))].sort();
    const filtersDiv = document.getElementById('categoryFilters');
    categories.forEach(cat => {
        const isFemale = cat.includes('F');
        const displayLabel = cat.replace('F', '');
        const wrapper = document.createElement('div');
        wrapper.className = 'filter-wrapper';
        wrapper.style.backgroundColor = isFemale ? '#e84393' : '#3498db';
        wrapper.style.borderColor = isFemale ? '#d81b60' : '#2980b9';
        wrapper.innerHTML = `
            <label class="filter-item">

    const controlsDiv = document.getElementById('dynamicControls');
    ranks.forEach(rank => {
        const safeId = rank.replace(/[^a-zA-Z0-9]/g, '_');
        controlsDiv.innerHTML += `<div class="control-group"><label>${rank}</label><input type="number" id="w_${safeId}" value="${defaultWeights[rank]}" onchange="updateDashboard()"></div>`;

    const headerRow = document.getElementById('tableHeader');

    window.searchPlayer = function() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const resDiv = document.getElementById('searchResults');
        if(query.length < 3) { resDiv.style.display = 'none'; return; }
        const matches = rawData.filter(p => p.nom.toLowerCase().includes(query) || p.prenom.toLowerCase().includes(query)).slice(0, 40);
        resDiv.style.display = 'block';
        if(matches.length === 0) return resDiv.innerHTML = '<div style="padding: 15px; color: #7f8c8d;">Aucun joueur.</div>';
        
        let html = '';
        matches.forEach(p => {
            const safeClub = p.club.replace(/"/g, '&quot;');
            const yearLabel = p.sexe_court === 'F' ? p.annee_naissance + ' Filles' : p.annee_naissance + ' Garçons';
            html += `<div class="search-item">
                        <div style="flex-grow: 1;">
                            <a href="https://tenup.fft.fr/palmares/${p.id_crm}" target="_blank" class="player-link">
                                <span class="p-name">${p.prenom.toLowerCase()} <strong>${p.nom.toUpperCase()}</strong></span>
                            </a>
                            <span class="p-rank">${p.classement}</span>
                            <span style="font-size: 0.8em; color: #7f8c8d; margin-left: 10px;">(${yearLabel})</span>
                        </div>
                        <div>
                            <a class="club-link" data-club="${safeClub}" onclick="showDetails(this.getAttribute('data-club'))" style="font-size: 0.9em;">${p.club} ➡</a>
                        </div>
                     </div>`;
        });
        resDiv.innerHTML = html;
    }

    window.searchClub = function() {
        const query = document.getElementById('searchClubInput').value.toLowerCase().trim();
        const resDiv = document.getElementById('searchClubResults');
        if(query.length < 3) { resDiv.style.display = 'none'; return; }
        const uniqueClubs = [...new Set(rawData.map(p => p.club))];
        const matches = uniqueClubs.filter(c => c.toLowerCase().includes(query)).slice(0, 15);
        resDiv.style.display = 'block';
        if(matches.length === 0) return resDiv.innerHTML = '<div style="padding: 15px; color: #7f8c8d;">Aucun club.</div>';
        
        let html = '';
        matches.forEach(c => {
            const safeClub = c.replace(/"/g, '&quot;');
            html += `<div class="search-item" style="cursor: pointer;" data-club="${safeClub}" onclick="showDetails(this.getAttribute('data-club'))">
                        <strong>${c}</strong> <span style="color: #3498db; font-size: 0.9em;">Voir les effectifs ➡</span>
                     </div>`;
        });
        resDiv.innerHTML = html;
    }

    window.toggleGenders = function(mode) {
        document.querySelectorAll('.cat-checkbox').forEach(cb => {
            if(mode === 'ALL') cb.checked = true;
            else if(mode === 'NONE') cb.checked = false;
            else if(mode === 'F') cb.checked = cb.dataset.gender === 'F';
            else if(mode === 'M') cb.checked = cb.dataset.gender === 'M';
        });
        updateDashboard();
    }

    window.updateDashboard = function() {
        document.querySelectorAll('.cat-checkbox').forEach(cb => {
            cb.closest('.filter-wrapper').style.opacity = cb.checked ? '1' : '0.4';
        });

        const checkedBoxes = Array.from(document.querySelectorAll('.cat-checkbox:checked')).map(cb => cb.value);

        const currentWeights = {};
        ranks.forEach(rank => {
            const safeId = rank.replace(/[^a-zA-Z0-9]/g, '_');
            currentWeights[rank] = parseFloat(document.getElementById('w_' + safeId).value) || 0;
        });

        const clubMap = new Map();
        rawData.forEach(p => {
            if (checkedBoxes.includes(p.category)) {
                if (!clubMap.has(p.club)) {
                    const initData = { club: p.club, total: 0 };
                    ranks.forEach(r => initData[r] = 0);
                    clubMap.set(p.club, initData);
                }
                const clubData = clubMap.get(p.club);
                if (ranks.includes(p.classement)) {
                    clubData[p.classement]++;
                    clubData.total++;
                }
            }
        });

        const processed = Array.from(clubMap.values()).map(c => {
            let score = 0;
            ranks.forEach(r => score += (c[r] * currentWeights[r]));
            return { ...c, score: score };
        });
        
        processed.sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return b.total - a.total;
        });

        let currentRank = 1;
        processed.forEach((c, i) => {
            if (i > 0) {
                const prev = processed[i - 1];
                if (!((c.score === prev.score) && (c.total === prev.total))) currentRank = i + 1;
            }
            c.rank = currentRank;
        });

        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';
        if(processed.length === 0) return tbody.innerHTML = `<tr><td colspan="${ranks.length + 4}">Aucune donnée.</td></tr>`;

        processed.forEach((c) => {
            const tr = document.createElement('tr');
            if(c.club && c.club.toUpperCase().includes('CHAMPS SUR MARNE')) tr.classList.add('highlight-champs');
            else if(c.rank <= 3) tr.className = 'top-tier';
            
            const safeClub = c.club.replace(/"/g, '&quot;');
            let htmlStr = `<td>${c.rank}</td><td><a class="club-link" data-club="${safeClub}" onclick="showDetails(this.getAttribute('data-club'))">${c.club}</a></td>`;
            ranks.forEach(r => htmlStr += `<td>${c[r] === 0 ? '' : c[r]}</td>`); 
            htmlStr += `<td>${c.total}</td><td><strong>${c.score}</strong></td>`;
            tr.innerHTML = htmlStr;
            tbody.appendChild(tr);
        });
    }
    
    window.showDetails = function(clubName) {
        lastViewedClub = clubName;
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('mainTitle').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        
        const backBtn = document.getElementById('dynamicBackButton');
        backBtn.innerText = "⬅ Retour au tableau de bord";
        backBtn.onclick = hideDetails;
        window.scrollTo(0, 0);
        
        const clubPlayers = rawData.filter(p => p.club === clubName);
        const garcons = clubPlayers.filter(p => p.sexe_court === 'M');
        const filles = clubPlayers.filter(p => p.sexe_court === 'F');
        
        let html = `<h2>Détail des Effectifs : ${clubName}</h2>`;
        html += renderGenderSection("Garçons", garcons, false);
        html += renderGenderSection("Filles", filles, true);
        document.getElementById('detailContent').innerHTML = html;
    }
    
    function renderGenderSection(title, players, isFemale) {
        if (players.length === 0) return '';
        const labelText = isFemale ? "joueuses" : "joueurs";
        let html = `<div class="gender-section"><h3 class="gender-title">${title} (${players.length} ${labelText})</h3><div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; margin-top:15px;">`;
        
        const years = [...new Set(players.map(p => p.annee_naissance))].sort((a,b) => b - a);
        const headerColor = isFemale ? '#e84393' : '#3498db'; 
        
        years.forEach(y => {
            const yearPlayers = players.filter(p => p.annee_naissance === y);
            yearPlayers.sort((a,b) => (defaultWeights[b.classement] || 0) - (defaultWeights[a.classement] || 0));
            const categoryCode = isFemale ? `${y}F` : `${y}`;
            
            html += `<div class="year-card">
                        <h4 class="year-header" style="background-color: ${headerColor};" onclick="showDepartmentRanking('${categoryCode}', true)">
                            🏆 ${y} (${yearPlayers.length})
                        </h4><ul style="max-height: 350px; overflow-y: auto;">`;
            yearPlayers.forEach(p => {
                /* ⚡ CORRECTION : Ligne simple sans le club ni le département */
                html += `<li style="padding: 8px 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                            <a href="https://tenup.fft.fr/palmares/${p.id_crm}" target="_blank" class="player-link">
                                <span class="p-name">${p.prenom.toLowerCase()} <strong>${p.nom.toUpperCase()}</strong></span>
                            </a> <span class="p-rank">${p.classement}</span>
                         </li>`;
            });
            html += `</ul></div>`;
        });
        html += `</div></div>`;
        return html;
    }

    window.showDepartmentRanking = function(category, fromClub) {
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('mainTitle').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        
        const backBtn = document.getElementById('dynamicBackButton');
        if (fromClub && lastViewedClub) {
            backBtn.innerText = `⬅ Retour au club ${lastViewedClub}`;
            backBtn.onclick = () => showDetails(lastViewedClub);
        } else {
            backBtn.innerText = "⬅ Retour au tableau de bord";
            backBtn.onclick = hideDetails;
        }
        window.scrollTo(0, 0);
        
        const catPlayers = rawData.filter(p => p.category === category);
        catPlayers.sort((a,b) => (defaultWeights[b.classement] || 0) - (defaultWeights[a.classement] || 0));
        
        const isFemale = category.includes('F');
        const headerColor = isFemale ? '#e84393' : '#3498db';
        const displayCat = isFemale ? category.replace('F', ' Filles') : category + ' Garçons';
        
        let html = `<h2>🏆 Classement : ${displayCat}</h2>`;
        html += `<div class="gender-section"><div class="year-card" style="max-width: 900px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                 <h4 style="background-color: ${headerColor}; font-size: 1.2em; padding: 12px; cursor: default;">Top ${catPlayers.length}</h4>
                 <ul style="max-height: 65vh;">`;
        
        let currentRank = 1;
        catPlayers.forEach((p, index) => {
            if (index > 0 && p.classement !== catPlayers[index-1].classement) currentRank = index + 1;
            
            const dRaw = deptNames[p.code_comite] || p.code_comite;
            const dCap = dRaw.charAt(0).toUpperCase() + dRaw.slice(1).toLowerCase();
            
            html += `<li style="padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee;">
                        <div style="display:flex; align-items:center;">
                            <span class="rank-badge">#${currentRank}</span>
                            <a href="https://tenup.fft.fr/palmares/${p.id_crm}" target="_blank" class="player-link" style="display: flex; flex-direction: column;">
                                <span class="p-name">${p.prenom.toLowerCase()} <strong>${p.nom.toUpperCase()}</strong></span>
                                <span class="p-detail-line">${p.club} <span class="p-dept-name">- ${dCap}</span></span>
                            </a>
                        </div>
                        <span class="p-rank">${p.classement}</span>
                     </li>`;
        });
        html += `</ul></div></div>`;
        document.getElementById('detailContent').innerHTML = html;
    }

    window.hideDetails = function() {
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('mainView').style.display = 'block';
        document.getElementById('mainTitle').style.display = 'block';
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchClubInput').value = '';
        document.getElementById('searchClubResults').style.display = 'none';
    }

    updateDashboard();
</script>
