<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tournois TenUp</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<style>
body{background:#f0f2f5;font-size:14px;padding-bottom:70px}
#topbar{background:#1a1a2e;z-index:1030}
.t-card{border-radius:10px;border:none}
.t-card.is-over{opacity:.45}
.fav-btn{background:none;border:none;font-size:1.3em;color:#ccc;padding:0 3px;line-height:1;cursor:pointer}
.fav-btn.active{color:#fd7e14}
.ep-line{padding:2px 0;border-bottom:1px solid #f2f2f2;font-size:.82em}
.ep-line:last-child{border-bottom:none}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:.8em;
       border:2px solid #dee2e6;cursor:pointer;user-select:none;background:#fff;margin:3px;transition:.15s}
.chip.active{background:#0d6efd;color:#fff;border-color:#0d6efd}
#mob-dist-max{accent-color:#0d6efd}
.offcanvas-bottom{border-radius:16px 16px 0 0}
#mob-more-btn{border-radius:20px;padding:8px 32px}
</style>
</head>
<body>

<div class="sticky-top py-2 px-2" id="topbar">
  <div class="d-flex gap-2 align-items-center">
    <input type="search" id="mob-search" class="form-control form-control-sm"
           placeholder="🔍 Rechercher..." oninput="mobFilter()">
    <button class="btn btn-sm btn-outline-light text-nowrap"
            data-bs-toggle="offcanvas" data-bs-target="#filterDrawer">⚙️ Filtres</button>
    <button class="btn btn-sm btn-outline-light" id="mob-btn-gist" onclick="openGistSetup()"
            title="Sync favoris">🔑</button>
  </div>
  <div class="d-flex gap-2 mt-1 align-items-center">
    <small class="flex-grow-1" id="mob-count" style="color:#adb5bd"></small>
    <label class="text-secondary small me-1">Tri :</label>
    <select id="mob-sort" class="form-select form-select-sm"
            style="width:auto;background:#2a2a3e;color:#fff;border-color:#444" onchange="mobFilter()">
      <option value="dist">Distance</option>
      <option value="date">Date début</option>
      <option value="name">Nom</option>
    </select>
  </div>
</div>

<div class="offcanvas offcanvas-bottom" tabindex="-1" id="filterDrawer" style="height:82vh">
  <div class="offcanvas-header pb-1">
    <h6 class="offcanvas-title fw-bold">Filtres</h6>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body pt-1 overflow-auto">

    <div class="mb-3 p-2 bg-light rounded">
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="mob-hide-done" checked onchange="mobFilter()">
        <label class="form-check-label small" for="mob-hide-done">Masquer tournois terminés</label>
      </div>
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="mob-hide-green" checked onchange="mobFilter()">
        <label class="form-check-label small" for="mob-hide-green" style="color:#198754">Masquer Vert / Orange (débutants)</label>
      </div>
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="mob-absent" onchange="mobFilter()">
        <label class="form-check-label small" for="mob-absent">🚫 Masquer si absent (Planning)</label>
      </div>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="mob-fav-only" onchange="mobFilter()">
        <label class="form-check-label small" for="mob-fav-only">★ Favoris seulement</label>
      </div>
    </div>

    <div class="mb-3">
      <label class="small fw-bold">Distance max (vol d'oiseau) :
        <span id="mob-dist-val" class="text-primary">600 km</span></label>
      <input type="range" id="mob-dist-max" class="form-range mt-1"
             min="10" max="600" step="10" value="600"
             oninput="document.getElementById('mob-dist-val').textContent=this.value+' km';mobFilter()">
    </div>

    <div class="mb-3">
      <label class="small fw-bold">Trajet max :
        <span id="mob-time-val" class="text-primary">∞</span></label>
      <input type="range" id="mob-time-max" class="form-range mt-1"
             min="15" max="300" step="15" value="300"
             oninput="var v=parseInt(this.value);document.getElementById('mob-time-val').textContent=(v>=300?'∞':v+' min');mobFilter()">
    </div>

    <div class="mb-3">
      <div class="small fw-bold mb-1">Dates</div>
      <div class="d-flex gap-2 align-items-center">
        <input type="date" id="mob-date-start" class="form-control form-control-sm" onchange="mobFilter()">
        <span class="small text-muted">→</span>
        <input type="date" id="mob-date-end" class="form-control form-control-sm" onchange="mobFilter()">
      </div>
    </div>

    <div class="mb-3">
      <div class="small fw-bold mb-1">Durée max du tournoi</div>
      <div id="mob-dur-chips" class="d-flex flex-wrap"></div>
    </div>

    <div class="mb-3">
      <div class="small fw-bold mb-1">Format</div>
      <div id="mob-fmt-chips" class="d-flex flex-wrap"></div>
    </div>

    <div class="mb-3">
      <div class="small fw-bold mb-1">Épreuves</div>
      <div id="mob-ep-chips" class="d-flex flex-wrap"></div>
    </div>

    <div class="mb-3">
      <div class="small fw-bold mb-1">Statut inscription</div>
      <div id="mob-statut-chips" class="d-flex flex-wrap"></div>
    </div>

    <div class="mb-3">
      <div class="small fw-bold mb-1" style="color:#9775fa">Coefficient ×</div>
      <div id="mob-coeff-chips" class="d-flex flex-wrap"></div>
    </div>

    <div class="d-flex gap-2 mt-3 pb-2">
      <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="mobReset()">↺ Réinitialiser</button>
      <button class="btn btn-sm btn-primary flex-fill" data-bs-dismiss="offcanvas">✓ Appliquer</button>
    </div>
    <div class="d-flex gap-2 pb-3 border-top pt-2">
      <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="exportFavs()">📥 Exporter favoris</button>
      <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="document.getElementById('mob-fav-import-input').click()">📤 Importer</button>
      <input type="file" id="mob-fav-import-input" accept=".json" style="display:none" onchange="importFavsMob(this)">
    </div>
  </div>
</div>

<div class="px-2 pt-2" id="mob-cards"></div>
<div class="text-center pb-3 mt-1" id="mob-more-wrap" style="display:none">
  <button class="btn btn-outline-secondary" id="mob-more-btn" onclick="mobMore()">Afficher plus</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

function isTournamentBlocked(debut, fin, planning) {
  if (!debut || !Object.keys(planning).length) return false;
  var d1 = new Date(debut + 'T12:00:00'), d2 = new Date((fin || debut) + 'T12:00:00');
  var duration = Math.round((d2 - d1) / 86400000) + 1, overlap = 0, cur = new Date(d1);
  while (cur <= d2) {
    var ds = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
    if (planning[ds]) overlap++;
    cur.setDate(cur.getDate() + 1);
  }
  if (!overlap) return false;
  if (duration <= 4) return true;
  if (duration <= 14) return overlap / duration >= 0.4;
  return overlap / duration >= 0.6;
}

  _activeCoeffs = checkedCoeff;
  var planning  = absent ? getPlanningData() : {};
  var sortBy    = document.getElementById('mob-sort').value;

  _filtered = _DATA.filter(function(t) {
    if (hideDone && t.dateFin && t.dateFin < _TODAY) return false;
    if (hideGreen) {
      var lbl = t.libelle.toLowerCase();
      if (lbl.indexOf('vert') !== -1 || lbl.indexOf('orange') !== -1) return false;
    }
    if (favOnly && !_favs.has(t.id)) return false;
    if (absent && isTournamentBlocked(t.dateDebut, t.dateFin, planning)) return false;
    if (t.distKm && t.distKm > distMax) return false;
    if (t.roadMin && t.roadMin > timeMax) return false;
    if (dateStart) {
      if (!dateEnd) {
        if (t.dateDebut && t.dateDebut !== dateStart) return false;
      } else {
        if (t.dateFin  && t.dateFin  < dateStart) return false;
        if (t.dateDebut && t.dateDebut > dateEnd)  return false;
      }
    } else if (dateEnd) {
      if (t.dateDebut && t.dateDebut > dateEnd) return false;
    }
    if (durMax < Infinity && t.durationDays && t.durationDays > durMax) return false;
    if (checkedFmt.length > 0) {
      if (!checkedFmt.some(function(f){return t.fmtAll.indexOf(f)!==-1;})) return false;
    }
    if (checkedEp.length > 0) {
      var keys = t.epreuves.map(function(e){return e.key;});
      if (!checkedEp.some(function(k){return keys.indexOf(k)!==-1;})) return false;
    }
    if (checkedSt.length > 0) {
      if (!checkedSt.some(function(s){return t.statuts.indexOf(s)!==-1;})) return false;
    }
    if (checkedCoeff.length > 0) {
      if (!checkedCoeff.some(function(c){return t.coeffs.indexOf(c)!==-1;})) return false;
    }
    if (q) {
      var hay = (t.libelle+' '+t.nomClub+' '+t.ville).toLowerCase();
      if (hay.indexOf(q)===-1) return false;
    }
    return true;
  });

  _filtered.sort(function(a,b) {
    if (sortBy==='date') return (a.dateDebut||'').localeCompare(b.dateDebut||'');
    if (sortBy==='name') return a.libelle.localeCompare(b.libelle);
    var da = a.roadKm||a.distKm||9999, db = b.roadKm||b.distKm||9999;
    return da - db;
  });

  mobRender();
}

  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var arr = JSON.parse(e.target.result);
      if (!Array.isArray(arr)) { alert('Format invalide'); return; }
      arr.forEach(function(id) { _favs.add(id); });
      _saveFavsLocal();
      _syncFavsToGist();
      document.querySelectorAll('[data-id]').forEach(function(el) {
        var id = el.getAttribute('data-id');
        var btn = el.querySelector('.fav-btn');
        if (btn) { btn.textContent = _favs.has(id) ? '★' : '☆'; btn.classList.toggle('active', _favs.has(id)); }
      });
      alert(arr.length + ' favoris importés (' + _favs.size + ' au total)');
    } catch(err) { alert('Erreur : ' + err.message); }
    input.value = '';
  };
  reader.readAsText(file);
}
function openGistSetup() {
  var cur = localStorage.getItem('tenup_gist_token') || '';
  document.getElementById('mob-gist-input').value = cur;
  var st = document.getElementById('mob-gist-status');
  st.innerHTML = cur ? '<span class="text-success">✔ Token configuré</span>' : '<span class="text-muted">Aucun token — sync désactivée</span>';
  document.getElementById('mob-btn-gist').style.borderColor = cur ? '#28a745' : '';
  new bootstrap.Modal(document.getElementById('mobGistModal')).show();
}
function saveMobGistToken() {
  var val = document.getElementById('mob-gist-input').value.trim();
  _GIST_TOKEN = val;
  if (val) localStorage.setItem('tenup_gist_token', val);
  else localStorage.removeItem('tenup_gist_token');
  document.getElementById('mob-btn-gist').style.borderColor = val ? '#28a745' : '';
  bootstrap.Modal.getInstance(document.getElementById('mobGistModal')).hide();
  if (val) _loadFavsFromGist();
}
function clearMobGistToken() {
  _GIST_TOKEN = '';
  localStorage.removeItem('tenup_gist_token');
  document.getElementById('mob-gist-input').value = '';
  document.getElementById('mob-gist-status').innerHTML = '<span class="text-muted">Token effacé</span>';
  document.getElementById('mob-btn-gist').style.borderColor = '';
}
})();
</script>

<!-- Modal : sync Gist token -->
<div class="modal fade" id="mobGistModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title">🔄 Sync favoris entre appareils</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-2">Entrez votre token GitHub (scope <code>gist</code>) pour synchroniser vos favoris. Stocké uniquement dans ce navigateur.</p>
        <input type="password" class="form-control form-control-sm font-monospace" id="mob-gist-input" autocomplete="new-password" placeholder="ghp_...">
        <div id="mob-gist-status" class="mt-2 small"></div>
      </div>
      <div class="modal-footer d-flex justify-content-between">
        <button type="button" class="btn btn-outline-danger btn-sm" onclick="clearMobGistToken()">Effacer</button>
        <div>
          <button type="button" class="btn btn-secondary btn-sm me-1" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="saveMobGistToken()">Sauvegarder</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
